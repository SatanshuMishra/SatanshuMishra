<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-labelledby="t d">
<title id="t">How the tools fit together</title>
<desc id="d">An idea goes to interphase, which writes the spec, then to mitosis, which builds it in parallel, then to lighthouse, which proves it works, and ends as a pull request a person reviews. After each step, logbook saves a git commit of where the work stands.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #e6edf3; }
.muted { fill: #9198a1; }
.dot { opacity: 0; animation: travel 7s linear 7.96 both; }
@keyframes travel { 0% { transform: translateX(0); opacity: 0; } 5% { transform: translateX(0); opacity: 1; }
  85% { transform: translateX(720px); opacity: 1; } 93%, 100% { transform: translateX(720px); opacity: 0; } }
@keyframes lit25 { 0%, 21% { transform: scale(1); opacity: .55; } 25% { transform: scale(1.6); opacity: 1; } 33%, 100% { transform: scale(1); opacity: .55; } }
@keyframes drop25 { 0%, 25% { transform: translateY(0); opacity: 0; } 25.5% { transform: translateY(0); opacity: 1; } 30% { transform: translateY(70px); opacity: 1; } 31%, 100% { transform: translateY(70px); opacity: 0; } }
@keyframes commit25 { 0%, 30% { transform: scale(1); opacity: .15; } 31% { transform: scale(1.7); opacity: 1; } 35%, 97% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: .15; } }
@keyframes lit45 { 0%, 41% { transform: scale(1); opacity: .55; } 45% { transform: scale(1.6); opacity: 1; } 53%, 100% { transform: scale(1); opacity: .55; } }
@keyframes drop45 { 0%, 45% { transform: translateY(0); opacity: 0; } 45.5% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(70px); opacity: 1; } 51%, 100% { transform: translateY(70px); opacity: 0; } }
@keyframes commit45 { 0%, 50% { transform: scale(1); opacity: .15; } 51% { transform: scale(1.7); opacity: 1; } 55%, 97% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: .15; } }
@keyframes lit65 { 0%, 61% { transform: scale(1); opacity: .55; } 65% { transform: scale(1.6); opacity: 1; } 73%, 100% { transform: scale(1); opacity: .55; } }
@keyframes drop65 { 0%, 65% { transform: translateY(0); opacity: 0; } 65.5% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(70px); opacity: 1; } 71%, 100% { transform: translateY(70px); opacity: 0; } }
@keyframes commit65 { 0%, 70% { transform: scale(1); opacity: .15; } 71% { transform: scale(1.7); opacity: 1; } 75%, 97% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: .15; } }
@keyframes lit85 { 0%, 81% { transform: scale(1); opacity: .55; } 85% { transform: scale(1.6); opacity: 1; } 93%, 100% { transform: scale(1); opacity: .55; } }
@keyframes drop85 { 0%, 85% { transform: translateY(0); opacity: 0; } 85.5% { transform: translateY(0); opacity: 1; } 90% { transform: translateY(70px); opacity: 1; } 91%, 100% { transform: translateY(70px); opacity: 0; } }
@keyframes commit85 { 0%, 90% { transform: scale(1); opacity: .15; } 91% { transform: scale(1.7); opacity: 1; } 95%, 97% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: .15; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
