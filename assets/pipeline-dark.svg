thouse</text><text x="590" y="127" text-anchor="middle" font-size="14" class="muted">proves it works</text><line x1="590" y1="142" x2="590" y2="212" stroke="#ab7df8" stroke-width="1.5" stroke-dasharray="3 5" opacity=".55"/><circle cx="590" cy="142" r="4" fill="#ab7df8" style="opacity:0;animation:drop65 7s linear 7.96 both"/><circle cx="590" cy="222" r="8" fill="#0d1117" stroke="#ab7df8" stroke-width="2"/><circle cx="590" cy="222" r="4" fill="#ab7df8" style="transform-box:fill-box;transform-origin:center;animation:commit65 7s linear 7.96 both"/><circle cx="770" cy="60" r="12" fill="#0d1117" stroke="#3fb950" stroke-width="2"/><circle cx="770" cy="60" r="5" fill="#3fb950" style="transform-box:fill-box;transform-origin:center;animation:lit85 7s linear 7.96 both"/><text x="770" y="104" text-anchor="middle" font-size="18" font-weight="600">pull request</text><text x="770" y="127" text-anchor="middle" font-size="14" class="muted">a person reviews</text><line x1="770" y1="142" x2="770" y2="212" stroke="#ab7df8" stroke-width="1.5" stroke-dasharray="3 5" opacity=".55"/><circle cx="770" cy="142" r="4" fill="#ab7df8" style="opacity:0;animation:drop85 7s linear 7.96 both"/><circle cx="770" cy="222" r="8" fill="#0d1117" stroke="#ab7df8" stroke-width="2"/><circle cx="770" cy="222" r="4" fill="#ab7df8" style="transform-box:fill-box;transform-origin:center;animation:commit85 7s linear 7.96 both"/>
<g class="dot"><circle cx="50" cy="60" r="13" fill="#4493f8" opacity="0.30"/><circle cx="50" cy="60" r="5.5" fill="#4493f8"/></g>
