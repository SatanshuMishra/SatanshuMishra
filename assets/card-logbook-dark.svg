<svg xmlns="http://www.w3.org/2000/svg" width="412" height="184" viewBox="0 0 412 184" role="img" aria-labelledby="t d">
<title id="t">logbook</title>
<desc id="d">logbook: Saves where the work stands in git, so a new session picks it back up. Built with TypeScript.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #e6edf3; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.muted { fill: #9198a1; }
.comet { animation: orbit 7s linear 5.1s 2; }
@keyframes orbit { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1150; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="1" y="1" width="410" height="182" rx="14" fill="#151b23" stroke="#3d444d"/>
<rect class="comet" x="1" y="1" width="410" height="182" rx="14" fill="none" stroke="#4493f8" stroke-width="1.5" stroke-dasharray="70 1080" stroke-linecap="round" opacity=".9"/>
<text x="24" y="38" class="mono muted" font-size="13">04 / memory</text>
<text x="24" y="74" font-size="26" font-weight="650">logbook</text>
<text x="24" y="106" font-size="17" class="muted">Saves where the work stands in git,</text>
<text x="24" y="129" font-size="17" class="muted">so a new session picks it back up.</text>
<circle cx="30" cy="158" r="6" fill="#3178c6"/>
<text x="43" y="163" font-size="14" class="muted">TypeScript</text>
</svg>
